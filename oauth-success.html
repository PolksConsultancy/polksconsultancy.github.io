<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <title>BigQuery Integration</title>
    </head>
    <body>
        <script>
            let params = {}, urlParams = new URLSearchParams(window.location.search);
            for(let [key, value] of urlParams.entries()) { params[key] = value; }
            if(params.code) {
                window.opener.postMessage({ access: params }, '*');
            }
            else {
                window.close();
            }
        </script>
    </body>
</html>
