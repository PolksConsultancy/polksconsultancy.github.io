<style>
    .review__reference .copy-item {
    display: inline;
    cursor: pointer;
}

.review__reference__label {
    margin: 0 4px 0 0;
    font-weight: 600;
}

.review__details {
    color: #6a6a67;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: .3px;
    line-height: 20px;
    margin: 0;
}

.review__consumer {
    color: #6a6a67;
    display: flex;
    flex-wrap: wrap;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: .3px;
    line-height: 20px;
    margin: 0 0 2px;
}

.review__consumer__name {
    margin: 0 8px 0 0;
}

.review__consumer__link {
    color: #4f71c0;
    text-decoration: underline;
    font-weight: 600;
}

.review__consumer__email {
    margin: 0 8px 0 0;
    display: -webkit-box;
    display: flex;
    -webkit-box-align: center;
    align-items: center;
    flex-basis: auto;
}

.review__consumer__email:before {
    content: "•";
    flex-shrink: 0;
    font-size: 10px;
    margin: 0 8px 0 0;
}

.review__text {
    margin: 0 0 32px;
    max-width: calc(100% - 100px);
    font-size: 15px;
    line-height: 24px;
}

.review__text_p{
    white-space: pre-line;
}

.review__stars {
    display: grid;
    -webkit-box-align: center;
    align-items: center;
    color: #6a6a67;
    gap: 8px 16px;
    grid-template-columns: auto max-content;
    margin: 0 0 16px;
}

.review {
    word-break: break-word;
    word-wrap: break-word;
    background: #fff;
    border: 1px solid #e5e5dd;
    border-radius: 16px;
    padding: 24px;
}

.trustpilotReviewBody {
    margin: 16px 0;
    margin-bottom: 0px;
}

.review__arrows__info {
    margin: 0 12px 12px 0;
    display: flex;
    font-weight: 500;
}

.trustpilotReviewOuter {
    display: block;
    box-sizing: border-box;
}



.copy-item__button {
    opacity: 0;
    position: relative;
    top: -1px;
    left: 5px;
}

.trustpilotReviewRefIdCopyDiv {
    -webkit-box-align: center;
    align-items: center;
    -webkit-box-pack: start;
    justify-content: flex-start;
    border-radius: 2px;
    display: inline-block;
    padding: 0px 8px;
    background: rgb(26, 102, 255);
    color: rgb(255, 255, 255);
}

.trustpilotReviewRefIdCopy {
    font-weight: bold;
    line-height: 14px;
    font-size: 9px;
    letter-spacing: 0.11px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: 3px;
}

.copy-item:hover .copy-item__button {
    opacity: 100%;
}

html, body {
    font-size: 16px;
    font-weight: 400;
    letter-spacing: .3px;
    line-height: 20px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    color: #1c1c1c;
    font-family: "Segoe UI", sans-serif, system-ui;
    width: calc(100% - 16px);
    height: max-content;
}

.review h4 {
    line-height: 0;
    display: none;
}

.review__stars span {
    font-size: 12px;
}

.review__details_sorce {
    display: none;
}

* {
    box-sizing: border-box;
}
</style>
